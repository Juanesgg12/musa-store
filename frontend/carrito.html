<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tu carrito — Musa Creativa</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/componentes.css" />
  <link rel="stylesheet" href="css/formularios.css" />
  <link rel="stylesheet" href="css/carrito.css" />
</head>
<body>
  <header class="encabezado contenedor">
    <a href="index.html" class="logo">
      <span class="logo__nombre">musa</span>
      <span class="logo__eslogan">creativa</span>
    </a>
    <nav class="nav-principal">
      <ul>
        <li><a href="index.html#productos">Catálogo</a></li>
        <li id="nav-cuenta"><a href="cuenta.html">Mi cuenta</a></li>
        <li><a href="carrito.html">Carrito <span id="nav-carrito-contador"></span></a></li>
      </ul>
    </nav>
  </header>

  <main class="contenedor">
    <section class="seccion">
      <h1 class="seccion__titulo">Tu carrito</h1>
      <div id="lista-carrito"></div>
      <div id="totales-carrito"></div>
    </section>

    <section class="seccion-checkout" id="seccion-checkout">
      <h2 class="seccion__titulo">Datos para el pedido</h2>

      <form id="form-pedido" class="formulario-auth visible">
        <div class="grupo-campos">
          <div class="campo">
            <label for="cliente-nombre">Nombre completo</label>
            <input type="text" id="cliente-nombre" name="clienteNombre" required />
          </div>
          <div class="campo">
            <label for="cliente-email">Email</label>
            <input type="email" id="cliente-email" name="clienteEmail" required />
          </div>
        </div>

        <div class="grupo-campos">
          <div class="campo">
            <label for="cliente-telefono">Teléfono</label>
            <input type="tel" id="cliente-telefono" name="clienteTelefono" />
          </div>
          <div class="campo">
            <label for="metodo">Método de entrega</label>
            <select id="metodo" name="metodo" required>
              <option value="DOMICILIO_LOCAL">Domicilio local</option>
              <option value="TRANSPORTADORA">Transportadora</option>
            </select>
          </div>
        </div>

        <div class="grupo-campos">
          <div class="campo">
            <label for="municipio">Municipio</label>
            <input type="text" id="municipio" name="municipio" required />
          </div>
          <div class="campo">
            <label for="direccion">Dirección</label>
            <input type="text" id="direccion" name="direccion" required />
          </div>
        </div>

        <button type="submit" class="boton-primario">Confirmar pedido</button>
      </form>
    </section>

    <div id="mensaje-pedido"></div>
  </main>

  <footer class="pie-pagina">
    <p>&copy; 2026 Musa Creativa</p>
  </footer>

  <script type="module" src="js/main-carrito.js"></script>
</body>
</html>
