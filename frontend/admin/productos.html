<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Productos — Panel Musa</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/formularios.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <p class="admin-sidebar__titulo">Musa Admin</p>
      <a href="productos.html" class="activa">Productos</a>
      <a href="categorias.html">Categorías</a>
      <a href="pedidos.html">Pedidos</a>
      <a href="usuarios.html">Usuarios</a>
      <a href="ventas.html">Ventas</a>
      <div class="admin-sidebar__separador"></div>
      <a href="../index.html">Volver a la tienda</a>
      <button type="button" id="btn-cerrar-sesion">Cerrar sesión</button>
    </aside>

    <main class="admin-contenido">
      <div class="admin-encabezado">
        <h1>Productos</h1>
        <button type="button" id="btn-nuevo" class="boton-primario">Nuevo producto</button>
      </div>

      <div class="admin-panel-formulario" id="panel-formulario">
        <h2 id="titulo-formulario">Nuevo producto</h2>
        <form id="form-producto">
          <input type="hidden" id="producto-id" />
          <div class="grupo-campos">
            <div class="campo">
              <label for="producto-nombre">Nombre</label>
              <input type="text" id="producto-nombre" name="nombre" required />
            </div>
            <div class="campo">
              <label for="producto-categoria">Categoría</label>
              <select id="producto-categoria" name="categoriaId" required></select>
            </div>
          </div>

          <div class="campo">
            <label for="producto-descripcion">Descripción</label>
            <input type="text" id="producto-descripcion" name="descripcion" />
          </div>

          <div class="grupo-campos">
            <div class="campo">
              <label for="producto-precio">Precio (COP)</label>
              <input type="number" id="producto-precio" name="precio" min="0" step="1" required />
            </div>
            <div class="campo">
              <label for="producto-stock">Stock</label>
              <input type="number" id="producto-stock" name="stock" min="0" step="1" required />
            </div>
          </div>

          <div class="campo campo-checkbox">
            <input type="checkbox" id="producto-personalizable" name="personalizable" />
            <label for="producto-personalizable">Personalizable</label>
          </div>

          <div class="campo campo-checkbox">
            <input type="checkbox" id="producto-activo" name="activo" checked />
            <label for="producto-activo">Activo</label>
          </div>

          <div id="mensaje-formulario-producto"></div>

          <div class="admin-panel-formulario__acciones">
            <button type="submit" class="boton-primario">Guardar</button>
            <button type="button" id="btn-cancelar" class="boton-enlace">Cancelar</button>
          </div>
        </form>
      </div>

      <div id="mensaje-productos"></div>

      <div class="admin-tabla-contenedor">
        <table class="admin-tabla">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Categoría</th>
              <th>Precio</th>
              <th>Stock</th>
              <th>Personalizable</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-productos-cuerpo"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script type="module" src="../js/main-admin-productos.js"></script>
</body>
</html>
